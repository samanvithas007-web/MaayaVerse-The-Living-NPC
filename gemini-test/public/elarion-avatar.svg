<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070e"/>
    </radialGradient>
    <radialGradient id="auraGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="cowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base -->
  <circle cx="120" cy="120" r="115" fill="url(#bgGrad)"/>
  <circle cx="120" cy="120" r="105" fill="url(#auraGlow)"/>

  <!-- Ornate Runes / Stars in Background -->
  <circle cx="120" cy="120" r="95" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="120" cy="120" r="82" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 8" opacity="0.3"/>

  <!-- Guardian Cloak / Shoulders -->
  <path d="M40 215 C55 170, 75 145, 120 145 C165 145, 185 170, 200 215 C175 228, 65 228, 40 215 Z" fill="url(#cowlGrad)"/>
  <!-- Cloak Collar / Trim -->
  <path d="M72 175 Q120 195 168 175 Q120 205 72 175 Z" fill="#d4af37" opacity="0.8"/>
  <circle cx="120" cy="188" r="6" fill="#38bdf8" filter="url(#glowEffect)"/>

  <!-- Hood and Shadow -->
  <path d="M68 145 C65 85, 80 50, 120 45 C160 50, 175 85, 172 145 C160 135, 140 120, 120 120 C100 120, 80 135, 68 145 Z" fill="#0f172a"/>
  
  <!-- Face within Hood -->
  <path d="M88 100 C88 80, 100 70, 120 70 C140 70, 152 80, 152 100 C152 125, 138 145, 120 148 C102 145, 88 125, 88 100 Z" fill="url(#faceGrad)" opacity="0.9"/>

  <!-- Mystical Guardian Cowl Drape -->
  <path d="M68 140 C65 75, 82 42, 120 38 C158 42, 175 75, 172 140 C155 125, 138 115, 120 115 C102 115, 85 125, 68 140 Z" fill="url(#cowlGrad)" opacity="0.95"/>

  <!-- Glowing Eyes -->
  <ellipse cx="106" cy="98" rx="5" ry="2.5" fill="#38bdf8" filter="url(#glowEffect)"/>
  <circle cx="106" cy="98" r="1.5" fill="#ffffff"/>
  <ellipse cx="134" cy="98" rx="5" ry="2.5" fill="#38bdf8" filter="url(#glowEffect)"/>
  <circle cx="134" cy="98" r="1.5" fill="#ffffff"/>

  <!-- Forehead Ancient Mark / Circlet -->
  <path d="M112 72 L120 62 L128 72 L120 78 Z" fill="#fef08a" filter="url(#glowEffect)"/>
  <line x1="98" y1="72" x2="142" y2="72" stroke="#d4af37" stroke-width="1.5" opacity="0.75"/>

  <!-- Golden Outer Frame Ring -->
  <circle cx="120" cy="120" r="115" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <circle cx="120" cy="120" r="110" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>

  <!-- Cardinal Rune Accents on Frame -->
  <polygon points="120,4 125,12 115,12" fill="#fef08a"/>
  <polygon points="120,236 125,228 115,228" fill="#fef08a"/>
  <polygon points="4,120 12,115 12,125" fill="#fef08a"/>
  <polygon points="236,120 228,115 228,125" fill="#fef08a"/>
</svg>
